# push 到 main 后自动构建，并把 public/ 推送到 cedriclee85/cedriclee85.github.io 的 master 分支。
# 推送凭证：仓库 Secret ACTIONS_DEPLOY_KEY（目标仓库中有写权限的 Deploy Key 的私钥）。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Hexo 8 要求 >= 20.19
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: cedriclee85/cedriclee85.github.io
          publish_branch: master
          publish_dir: ./public
